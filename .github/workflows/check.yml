name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      # Match the locked Playwright version; includes browsers and system deps.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - name: Verify bundled Chromium matches Playwright
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { chromium } = require('playwright')
          const executable = chromium.executablePath()
          if (!fs.existsSync(executable)) {
            throw new Error('Update the CI image to match the locked Playwright version: ' + executable)
          }
          console.log('Playwright', require('playwright/package.json').version)
          console.log('Bundled Chromium:', executable)
          NODE
      - name: Browser regressions
        timeout-minutes: 3
        run: npm run test:browser
      - name: Save browser results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test/browser-results/
          if-no-files-found: ignore
          retention-days: 7
